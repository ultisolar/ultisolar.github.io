<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档中心</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        h1 { text-align: center; }
        .links { margin-bottom: 20px; text-align: center; }
        .links a {
            display: inline-block;
            margin: 5px;
            padding: 6px 12px;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }
        iframe {
            width: 100%;
            height: 80vh;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>文档中心</h1>

    <div class="links">
        <a href="#" onclick="showPdf('摩尔信使MThings产品白皮书.pdf')">白皮书</a>
        <a href="#" onclick="showPdf('第二个文件.pdf')">文档2</a>
        <a href="#" onclick="showPdf('第三个文件.pdf')">文档3</a>
    </div>

    <iframe id="pdfFrame" src="摩尔信使MThings产品白皮书.pdf"></iframe>

    <script>
        function showPdf(file) {
            document.getElementById('pdfFrame').src = file;
            return false; // 不让页面跳转
        }
    </script>
</body>
</html>

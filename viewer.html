<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 预览</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <script>
        // 读取URL中的file参数
        const params = new URLSearchParams(window.location.search);
        const pdfFile = params.get('file') || '摩尔信使MThings产品白皮书.pdf';
        
        // 拼接PDF.js预览地址
        const viewerUrl = `https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(pdfFile)}`;
        
        // 写入iframe
        document.write(`<iframe id="pdf-viewer" src="${viewerUrl}"></iframe>`);
    </script>
</body>
</html>
